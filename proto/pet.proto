syntax = "proto3";

package pet;

service PetService {
  rpc GetMedicines (MedicineRequest) returns (MedicineResponse);
  rpc GetTeamMembers (Empty) returns (TeamResponse);
}

message MedicineRequest {
  string condition = 1;
}

message MedicineResponse {
  repeated string medicines = 1;
}

message Empty {}

message TeamResponse {
  repeated string members = 1;
}
